<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" width="100%" height="100%">
  <defs>
    <!-- Translucent Film-Blue Frosted Glass Gradient matching Miku Banner -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2442" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#133863" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#091B33" stop-opacity="0.76" />
    </linearGradient>

    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.08" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Analog Film Grain -->
    <filter id="filmNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="monoNoise" />
      <feComponentTransfer in="monoNoise" result="softNoise">
        <feFuncA type="linear" slope="0.06" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="screen" />
    </filter>

    <clipPath id="sClip">
      <rect x="0" y="0" width="1200" height="112" rx="12" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif; }
    .pulse { animation: pAnim 2.8s ease-in-out infinite; }
    .wave { stroke-dasharray: 8 6; animation: wAnim 10s linear infinite; }
    @keyframes pAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes wAnim {
      to { stroke-dashoffset: -112; }
    }
  </style>

  <g clip-path="url(#sClip)">
    <!-- Frosted Film Glass Base -->
    <rect width="1200" height="112" fill="url(#glassBg)" filter="url(#filmNoise)" />
    <!-- Subtle inner reflection line -->
    <line x1="16" y1="1.5" x2="1184" y2="1.5" stroke="url(#topHighlight)" stroke-width="1.5" />

    <!-- Left Telemetry Block -->
    <circle cx="38" cy="34" r="4" fill="#38BDF8" class="pulse" />
    <text x="52" y="38" fill="#BAE6FD" font-size="11.5" letter-spacing="2" class="mono">SIGNAL STATUS // OVERPASS 35MM</text>
    <text x="38" y="68" fill="#F8FAFC" font-size="17" font-weight="600" letter-spacing="1.5" class="sans">语言模型 - 系统工程 - 理性的音乐浪漫</text>
    <text x="38" y="90" fill="#7DD3FC" fill-opacity="0.85" font-size="11" letter-spacing="1.8" class="mono">BUILDING TRACEABLE SYSTEMS  ·  LATE-NIGHT REVERB</text>

    <!-- Center-Right Hand-drawn Cobalt Style Waveform & Meters -->
    <path d="M 650 58 Q 675 26 700 58 T 750 58 T 800 58 T 850 58 T 900 58 T 950 58 T 1000 58"
          fill="none" stroke="url(#waveGrad)" stroke-width="2.2" class="wave" />
    <path d="M 650 62 Q 685 88 720 62 T 790 62 T 860 62 T 930 62 T 1000 62"
          fill="none" stroke="#2563EB" stroke-opacity="0.55" stroke-width="1.5" />

    <!-- Right Mini Spec Tag (Cobalt Outline Style matching Miku Lineart) -->
    <rect x="1032" y="26" width="136" height="60" rx="8" fill="#0F294A" fill-opacity="0.55" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.5" />
    <text x="1100" y="48" fill="#E0F2FE" font-size="11" text-anchor="middle" letter-spacing="2" class="mono">44.1 kHz</text>
    <line x1="1050" y1="57" x2="1150" y2="57" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
    <text x="1100" y="75" fill="#7DD3FC" font-size="10.5" text-anchor="middle" letter-spacing="1.5" class="mono">SIDE A · LIVE</text>

    <!-- Cobalt Glass Border -->
    <rect x="1" y="1" width="1198" height="110" rx="12" fill="none" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1.4" />
  </g>
</svg>
