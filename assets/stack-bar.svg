<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 54" width="100%" height="100%">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123157" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0A1E38" stop-opacity="0.94" />
    </linearGradient>
  </defs>
  <style>
    .tag { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #E0F2FE; letter-spacing: 1px; }
    .dot { fill: #38BDF8; }
    .pill { fill: url(#pillBg); stroke: #38BDF8; stroke-opacity: 0.42; stroke-width: 1.2; }
  </style>

  <!-- 8 Core Stack Pills Centered across 1200px -->
  <g transform="translate(88, 9)">
    <rect x="0" y="0" width="114" height="36" rx="8" class="pill" />
    <circle cx="18" cy="18" r="3.2" class="dot" />
    <text x="64" y="23" text-anchor="middle" class="tag">Python</text>

    <rect x="128" y="0" width="84" height="36" rx="8" class="pill" />
    <circle cx="146" cy="18" r="3.2" class="dot" />
    <text x="176" y="23" text-anchor="middle" class="tag">Go</text>

    <rect x="226" y="0" width="144" height="36" rx="8" class="pill" />
    <circle cx="244" cy="18" r="3.2" class="dot" />
    <text x="304" y="23" text-anchor="middle" class="tag">TypeScript</text>

    <rect x="384" y="0" width="122" height="36" rx="8" class="pill" />
    <circle cx="402" cy="18" r="3.2" class="dot" />
    <text x="451" y="23" text-anchor="middle" class="tag">PyTorch</text>

    <rect x="520" y="0" width="122" height="36" rx="8" class="pill" />
    <circle cx="538" cy="18" r="3.2" class="dot" />
    <text x="587" y="23" text-anchor="middle" class="tag">FastAPI</text>

    <rect x="656" y="0" width="146" height="36" rx="8" class="pill" />
    <circle cx="674" cy="18" r="3.2" class="dot" />
    <text x="735" y="23" text-anchor="middle" class="tag">PostgreSQL</text>

    <rect x="816" y="0" width="136" height="36" rx="8" class="pill" />
    <circle cx="834" cy="18" r="3.2" class="dot" />
    <text x="890" y="23" text-anchor="middle" class="tag">LangChain</text>

    <rect x="966" y="0" width="90" height="36" rx="8" class="pill" />
    <circle cx="984" cy="18" r="3.2" class="dot" />
    <text x="1017" y="23" text-anchor="middle" class="tag">MCP</text>
  </g>
</svg>
